<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>AD Zoom Studio | Photography & Cinematography</title>
    <meta name="description" content="Award-level wedding photography, pre-wedding captures, and cinematic films by AD Zoom Studio, India. Crafting timeless visual heirlooms with editorial elegance." />
    <meta name="keywords" content="wedding photography India, pre-wedding shoot, wedding cinematography, luxury wedding films, AD Zoom Studio" />
    <meta name="author" content="AD Zoom Studio" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adzoomstudio.com/" />
    <meta property="og:title" content="AD Zoom Studio | Luxury Wedding & Cinematography" />

    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="AD Zoom Studio | Photography & Cinematography" />
    <meta property="twitter:description" content="Timeless wedding stories, pre-wedding shoots, and cinematic films handcrafted with refined editorial elegance." />
    <meta property="twitter:image" content="/logo.png" />

    <!-- PWA & Mobile Theme -->
    <meta name="theme-color" content="#0E0E0E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for LocalBusiness / ProfessionalService -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "AD Zoom Studio",
        "image": "https://adzoomstudio.com/logo.png",
        "description": "Premium Wedding Photography, Pre-Wedding shoots, and Cinematic Film Production in India.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN",
          "addressRegion": "India"
        },
        "priceRange": "$$$$",
        "telephone": "+919876543210",
        "openingHours": "Mo,Tu,We,Th,Fr,Sa 09:00-20:00"
      }
    </script>
  </head>
  <body class="bg-ink text-offwhite antialiased selection:bg-accent-orange selection:text-ink overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
